<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Painel Admin | Bebidas Menicucci</title>
    <meta name="description" content="Acesso ao painel administrativo da Bebidas Menicucci." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet"
          integrity="sha384-Pch9vO1JvBGpUxhyN+yUXZToWZCCKfRYGFEqsFBRnEreVVmXnbirIQsfzDBP8vmO"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <div class="login-branding">
                <span class="eyebrow">Acesso restrito</span>
                <h1>Painel admin</h1>
                <p>Entre com suas credenciais para gerenciar produtos, senha e o número do WhatsApp do carrinho.</p>
            </div>

            <div class="login-panel">
                <form class="login-form" th:action="@{/login}" method="post">
                    <div class="login-alert login-success" th:if="${param.logout}">
                        Seu acesso foi encerrado com sucesso. Você pode entrar novamente quando quiser.
                    </div>
                    <div class="login-alert login-error" th:if="${param.error}">
                        Usuário ou senha inválidos.
                    </div>

                    <label for="username">Usuário</label>
                    <input id="username" type="text" name="username" placeholder="Digite seu usuário" autocomplete="username" required />

                    <label for="password">Senha</label>
                    <input id="password" type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required />

                    <button class="primary-button full" type="submit">Entrar no painel</button>
                    <a class="ghost-button full login-back-link" th:href="@{/}">Voltar ao catálogo</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
